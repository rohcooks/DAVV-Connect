<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DAVV Connect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth" data-page="login">
  <img class="logo" src="img/logo.png" alt="DAVV logo">
  <h1 class="brand">DAVV <span>Connect</span></h1>
  <p class="tag">Your University. Your People. Your Community.</p>
  <form class="card" id="f" novalidate>
    <div class="tabs"><button type="button" class="on" data-t="email">Email Address</button><button type="button"
        data-t="mobile">Mobile Number</button></div>
    <label class="fld"><i data-i="mail"></i><input id="id" type="email" placeholder="Enter your email address"
        autocomplete="username"></label>
    <label class="fld"><i data-i="lock"></i><input id="pw" type="password" placeholder="Enter your password"
        autocomplete="current-password"><i class="eye" data-i="eyeoff"></i></label>
    <div class="row"><label class="chk"><input type="checkbox" id="rm" checked>Remember me</label><a href="#"
        id="fp">Forgot password?</a></div>
    <p class="err" id="err"></p>
    <button class="btn">Log In</button>
    <div class="or">or</div>
    <button type="button" class="btn ghost" id="uni"><i data-i="cap"></i>Continue with University Email</button>
    <p class="foot">New to DAVV Connect? <a href="signup.html">Create an account</a></p>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>

</html>

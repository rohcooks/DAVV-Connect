<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DAVV Connect – Communities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="communities">
  <main>
    <h1 class="pt">Communities</h1>
    <p class="ps">Your academic and personal communities.</p><label class="sb"><i data-i="search"></i><input id="sq"
        type="search" placeholder="Search communities..." autocomplete="off"></label>
    <div class="pills"><button class="on" data-t="official" id="t1" type="button">Official</button><button data-t="your"
        type="button">Your Communities</button><button id="cc" type="button"><i data-i="plus"></i>Create Group</button>
    </div>
    <div class="pn">
      <div class="lf">
        <div id="lh"></div>
        <div id="ll"></div>
      </div>
      <div class="rt">
        <div class="ch"><span class="ib"><i id="ci" data-i="code"></i></span>
          <div><b id="ct"></b><small id="cs"></small></div><span id="cm"></span><i data-i="search"></i><i
            data-i="more"></i>
        </div>
        <div id="ms" aria-live="polite"></div>
        <form class="cp" id="cf"><i id="clip" data-i="clip" role="button" tabindex="0"
            aria-label="Attach a file"></i><input type="file" id="fi" hidden><input type="text" id="mi"
            placeholder="Type a message..." autocomplete="off" aria-label="Message"><button aria-label="Send"><i
              data-i="send"></i></button></form>
      </div>
    </div>
  </main>
  <div class="modal fade group-modal" id="createGroupModal" tabindex="-1" aria-labelledby="createGroupTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="create-group-form">
          <div class="modal-header">
            <div>
              <h2 id="createGroupTitle">Create a group</h2>
              <p>Give your community a name to get started.</p>
            </div><button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="Close">×</button>
          </div>
          <div class="modal-body"><label for="group-name">Group name</label><input id="group-name" maxlength="48"
              placeholder="e.g. Project partners" autocomplete="off">
            <p id="group-error" class="group-error" aria-live="polite"></p>
          </div>
          <div class="modal-footer"><button type="button" class="modal-cancel"
              data-bs-dismiss="modal">Cancel</button><button type="submit" class="modal-submit">Create group</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>

</html>
